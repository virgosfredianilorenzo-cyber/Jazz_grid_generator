<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jazz Grid Generator</title>

<style id="css-app">

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CSS — APP
   Toolbar, layout, sections, mesures, accords, symboles
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Georgia', serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
#toolbar { background:#16213e; padding:12px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; border-bottom:2px solid #f0a500; position:sticky; top:0; z-index:100; }
#toolbar h1 { font-size:1.2rem; color:#f0a500; margin-right:10px; display:flex; flex-direction:column; align-items:flex-end; gap:1px; }
#toolbar-title { line-height:1.2; align-self:flex-start; }
#toolbar-ts { font-size:0.68rem; color:#aaa; font-family:'Courier New',monospace; font-weight:normal; letter-spacing:1px; }
#print-ts { display:none; }
@media print { #print-ts { display:block; font-size:0.68rem; color:#888; font-family:'Courier New',monospace; letter-spacing:1px; text-align:center; margin-top:3px; } }
.btn { background:#f0a500; color:#1a1a2e; border:none; padding:7px 14px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:0.85rem; transition:background 0.2s; }
.btn:hover { background:#ffc107; }
.btn.secondary { background:#2d4a7a; color:#eee; }
.btn.secondary:hover { background:#3a5f9a; }
.btn.danger { background:#c0392b; color:#fff; }
select, input[type="text"], input[type="number"] { background:#2d4a7a; color:#eee; border:1px solid #f0a500; padding:6px 10px; border-radius:4px; font-size:0.85rem; }
label { font-size:0.85rem; color:#aaa; }

/* Sélecteur de langue — intégré dans la toolbar, en fin de ligne */
#lang-selector { display:flex; align-items:center; gap:6px; background:#0f3460; border:1px solid #f0a500; border-radius:6px; padding:4px 10px; }
#lang-selector label { color:#f0a500; font-size:0.78rem; font-weight:bold; }
#lang-select { width:70px; font-size:0.82rem; padding:3px 6px; }

#kofi-btn { display:inline-flex; align-items:center; gap:5px; background:#ff5e5b; color:#fff; border-radius:6px; padding:5px 12px; font-size:0.8rem; font-weight:bold; text-decoration:none; white-space:nowrap; transition:background 0.2s, transform 0.15s; }
#kofi-btn:hover { background:#ff3a37; transform:translateY(-1px); }
#kofi-wrap { display:inline-flex; align-items:center; gap:8px; }
#kofi-wrap span { font-size:0.75rem; color:#aaa; white-space:nowrap; }
@media print { #kofi-wrap { position:fixed; bottom:8px; right:12px; z-index:9999; } #kofi-wrap span { display:none; } #kofi-btn { background:#ff5e5b !important; color:#fff !important; padding:4px 10px; font-size:0.72rem; } }

#transpose-group { display:flex; align-items:center; gap:6px; background:#0f3460; border:1px solid #f0a500; border-radius:6px; padding:4px 10px; }
#transpose-group label { color:#f0a500; font-size:0.8rem; font-weight:bold; }
#transpose-semitones { display:flex; align-items:center; gap:4px; }
#semitone-display { min-width:28px; text-align:center; font-size:0.85rem; color:#ffd060; font-weight:bold; }
.semi-btn { background:#2d4a7a; color:#f0a500; border:1px solid #f0a500; border-radius:3px; width:22px; height:22px; cursor:pointer; font-size:0.95rem; display:flex; align-items:center; justify-content:center; transition:background 0.15s; }
.semi-btn:hover { background:#f0a500; color:#1a1a2e; }
#transpose-key-select { width:58px; }

#dropzone { border:3px dashed #f0a500; border-radius:12px; margin:40px auto; max-width:500px; padding:60px 40px; text-align:center; cursor:pointer; transition:background 0.2s; }
#dropzone:hover, #dropzone.drag-over { background:rgba(240,165,0,0.1); }
#dropzone p { color:#aaa; margin-top:10px; font-size:0.9rem; }
#dropzone .icon { font-size:3rem; }
#file-input { display:none; }
#chart-editor { display:none; padding:20px; }
#chart-header { text-align:center; margin-bottom:20px; }
#chart-title { font-size:2rem; font-weight:bold; color:#f0a500; border:none; background:transparent; text-align:center; width:100%; outline:none; border-bottom:1px dashed #555; }
#chart-meta { display:flex; justify-content:center; gap:20px; margin-top:8px; flex-wrap:wrap; font-size:0.9rem; color:#aaa; }
#chart-meta input { width:120px; text-align:center; }
/* ── Key Modes Panel ── */
#key-modes-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:5px; max-width:680px; margin:0 auto; }
@media(max-width:600px){ #key-modes-grid { grid-template-columns:repeat(2,1fr); } }
.key-mode-pill { background:#12102a; border:1px solid #2a1a5a; border-radius:8px; padding:6px 10px; text-align:center; transition:border-color 0.15s, background 0.15s; cursor:default; }
.key-mode-pill:hover { border-color:#a78bfa; background:#1a1238; }
.key-mode-pill .kmp-degree { font-size:0.6rem; color:#7a6aaa; text-transform:uppercase; letter-spacing:1px; margin-bottom:2px; }
.key-mode-pill .kmp-note { font-size:1rem; font-weight:bold; color:#f0a500; font-family:'Georgia',serif; line-height:1.1; }
.key-mode-pill .kmp-name { font-size:0.68rem; color:#c4b5fd; font-style:italic; margin-top:1px; }
.key-mode-pill .kmp-chord { font-size:0.6rem; color:#7dd3fc; font-family:'Courier New',monospace; margin-top:2px; }
.key-mode-pill.kmp-tonic { border-color:#f0a500; background:#1a1200; }
.key-mode-pill.kmp-tonic .kmp-note { color:#ffd060; }
.section { margin-bottom:30px; background:#16213e; border-radius:8px; overflow:hidden; border:1px solid #2d4a7a; }
.section-header { background:#0f3460; padding:8px 14px; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.section-header-top { display:flex; align-items:center; gap:8px; width:100%; }
.section-label { font-weight:bold; color:#f0a500; font-size:0.9rem; border:none; background:none; border-bottom:1px dashed #f0a50055; padding:2px 6px; cursor:pointer; }
.section-annot-row { width:100%; display:flex; align-items:center; gap:8px; padding-top:4px; border-top:1px dashed #1a3060; margin-top:2px; }
.section-annot-input { flex:1; background:transparent; border:none; outline:none; color:#93c5fd; font-size:0.78rem; font-style:italic; font-family:Georgia,serif; }
.section-annot-input::placeholder { color:#2d4a7a; }
.section-annot-badge { font-size:0.65rem; color:#3d6aaa; }
.section-actions { margin-left:auto; display:flex; gap:6px; align-items:center; }
.section-actions button { background:none; border:1px solid #555; color:#aaa; padding:3px 8px; border-radius:3px; cursor:pointer; font-size:0.75rem; }
.section-actions button:hover { border-color:#f0a500; color:#f0a500; }
.section-drag-handle { cursor:grab; color:#4a6a9a; font-size:1rem; padding:2px 6px; border-radius:3px; user-select:none; transition:color 0.15s; }
.section-drag-handle:hover { color:#f0a500; }
.section-drag-handle:active { cursor:grabbing; }
.section.dragging { opacity:0.4; border:2px dashed #f0a500 !important; }
.section.drag-over-top { border-top:3px solid #f0a500 !important; }
.section.drag-over-bottom { border-bottom:3px solid #f0a500 !important; }
.section-annot-display { padding:6px 14px 4px; background:#0a2040; font-size:0.78rem; font-style:italic; color:#93c5fd; border-bottom:1px solid #1a3060; display:flex; gap:8px; align-items:flex-start; }
.section-annot-display .annot-icon { color:#3d6aaa; flex-shrink:0; }
.measures-grid { display:grid; padding:12px; gap:6px; }
.measure { background:#1e3a5f; border:1px solid #2d5a8a; border-radius:4px; padding:4px; position:relative; transition:border-color 0.2s; display:flex; flex-direction:column; }
.measure:hover { border-color:#f0a500; }
.measure-drag-handle { cursor:grab; color:#2d5a8a; font-size:0.8rem; padding:0 4px 0 2px; user-select:none; transition:color 0.15s; align-self:flex-start; margin-top:1px; flex-shrink:0; }
.measure-drag-handle:hover { color:#f0a500; }
.measure-drag-handle:active { cursor:grabbing; }
.measure.measure-dragging { opacity:0.35; border:2px dashed #f0a500 !important; }
.measure.measure-drag-over-left { border-left:3px solid #f0a500 !important; }
.measure.measure-drag-over-right { border-right:3px solid #f0a500 !important; }
/* ── Barlines existantes (compatibilité) ── */
.barline-repeat-start { border-left:4px double #f0a500; }
.barline-repeat-end   { border-right:4px double #f0a500; }
/* ── Barlines enrichies ── */
.bl-normal       {}
.bl-double-left  { border-left: 3px double #ccc !important; }
.bl-double-right { border-right:3px double #ccc !important; }
.bl-final-left   { border-left: 5px solid #ccc !important; }
.bl-final-right  { border-right:5px solid #ccc !important; }
.bl-repeat-start { border-left:4px double #f0a500 !important; }
.bl-repeat-end   { border-right:4px double #f0a500 !important; }
/* ── Volta bracket ── */
.volta-bracket { position:absolute; top:-18px; left:0; right:0; height:16px;
  border-top:2px solid #7dd3fc; border-left:2px solid #7dd3fc;
  font-size:0.65rem; font-weight:bold; color:#7dd3fc;
  padding:1px 4px; pointer-events:none; z-index:2; }
.volta-bracket.volta-open { border-right:none; }
.volta-bracket.volta-closed { border-right:2px solid #7dd3fc; }
/* ── Boutons barline hover ── */
.barline-btn { position:absolute; top:50%; transform:translateY(-50%);
  width:14px; height:32px; background:none; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity 0.15s; z-index:5; font-size:0.7rem; }
.barline-btn-left  { left:-7px; }
.barline-btn-right { right:-7px; }
.measure:hover .barline-btn { opacity:0.6; }
.barline-btn:hover { opacity:1 !important; color:#f0a500; }
/* ── Symboles de navigation au-dessus de la mesure ── */
.nav-symbol { position:absolute; top:-22px; left:50%; transform:translateX(-50%);
  font-size:1.1rem; color:#f0c060; cursor:pointer; z-index:3;
  white-space:nowrap; line-height:1; }
.nav-symbol.nav-text { font-size:0.62rem; font-weight:bold; font-family:'Courier New',monospace;
  color:#f0c060; background:#1a1a2e; border:1px solid #f0c06088;
  border-radius:3px; padding:1px 4px; top:-20px; }
.nav-symbol.nav-coda  { color:#86efac; }
.nav-symbol.nav-segno { color:#c4b5fd; }
/* ── Bouton nav hover ── */
.nav-add-btn { position:absolute; top:-18px; right:2px; width:14px; height:14px;
  background:none; border:1px dashed #4a6a9a; border-radius:2px; cursor:pointer;
  font-size:0.6rem; color:#4a6a9a; opacity:0; transition:opacity 0.15s; z-index:4;
  display:flex; align-items:center; justify-content:center; line-height:1; }
.measure:hover .nav-add-btn { opacity:0.7; }
.nav-add-btn:hover { opacity:1 !important; color:#f0c060; border-color:#f0c060; }
/* ── Popup menu barline / nav ── */
.bl-popup { position:absolute; background:#16213e; border:1px solid #f0a500;
  border-radius:6px; padding:6px; z-index:200; display:flex; flex-direction:column; gap:3px;
  min-width:130px; box-shadow:0 4px 16px rgba(0,0,0,0.5); }
.bl-popup button { background:none; border:none; color:#eee; font-size:0.78rem;
  cursor:pointer; padding:4px 8px; border-radius:3px; text-align:left; white-space:nowrap; }
.bl-popup button:hover { background:#2d4a7a; color:#f0a500; }
.bl-popup button.active-item { color:#f0c060; font-weight:bold; }
.bl-popup hr { border:none; border-top:1px solid #2d4a7a; margin:2px 0; }
.beats-row { display:flex; gap:2px; }
.chord-slot { flex:1; display:flex; flex-direction:column; border:1px solid transparent; border-radius:4px; transition:border-color 0.15s; cursor:pointer; min-width:0; }
.chord-slot:hover { border-color:#f0a50088; background:rgba(240,165,0,0.06); }
.chord-slot:hover .chord-edit-hint { opacity:1; }
.chord-header { text-align:center; padding:6px 2px 2px; }
.chord-symbol { font-size:1.05rem; font-weight:bold; color:#eee; line-height:1.2; }
.chord-duration { font-size:0.6rem; color:#88a; }
.chord-edit-hint { font-size:0.55rem; color:#f0a500; opacity:0; transition:opacity 0.15s; text-align:center; }
.chord-theory { display:flex; flex-direction:column; gap:3px; }
.theory-row { display:flex; align-items:baseline; gap:4px; font-size:0.78rem; line-height:1.4; padding:2px 4px; }
.theory-row-label { color:#7a6aaa; font-size:0.72rem; font-weight:bold; min-width:20px; flex-shrink:0; }
.theory-row-value { font-family:'Courier New',monospace; word-break:break-word; }
.mode-val  { color:#c4b5fd; font-style:italic; }
.modes-alt-row { font-size:0.62rem; color:#6a5a8a; font-style:italic; padding:2px 4px 0; line-height:1.4; word-break:break-word; }
.arp-val   { color:#7dd3fc; }
.tens-val  { color:#86efac; }
.chord-free-annot { font-size:0.62rem; font-style:italic; padding:1px 3px; border-top:1px dashed #3d2a6a; word-break:break-word; line-height:1.3; }
.chord-annot-icon { font-size:0.58rem; text-align:center; opacity:0; color:#a78bfa; transition:opacity 0.15s; }
.chord-slot:hover .chord-annot-icon { opacity:0.8; }
.chord-slot.has-annot .chord-annot-icon { opacity:0.6; }
.chord-del-btn { position:absolute; top:2px; right:2px; background:none; border:none; color:#c0392b; font-size:0.6rem; cursor:pointer; opacity:0; transition:opacity 0.2s; }
.measure:hover .chord-del-btn { opacity:1; }
.add-chord-btn { align-self:stretch; display:flex; align-items:center; justify-content:center; min-width:22px; background:none; border:1px dashed #2d5a8a; border-radius:4px; color:#2d5a8a; cursor:pointer; font-size:1rem; transition:all 0.15s; flex-shrink:0; }
.add-chord-btn:hover { border-color:#f0a500; color:#f0a500; }
.add-measure-btn,.add-section-btn { border:2px dashed #2d5a8a; background:none; color:#2d5a8a; border-radius:4px; min-height:60px; cursor:pointer; font-size:1.4rem; display:flex; align-items:center; justify-content:center; transition:all 0.2s; }
.add-measure-btn:hover,.add-section-btn:hover { border-color:#f0a500; color:#f0a500; }
/* ——— Symboles spéciaux de mesure ——— */
.chord-slot.sym-repeat   { background:rgba(240,165,0,0.07); }
.chord-slot.sym-repeat2  { background:rgba(240,165,0,0.07); }
/* ——— Accord alternatif (small chord) ——— */
.alt-chord-wrap { position:relative; }
.alt-chord-display { position:absolute; top:-14px; right:0;
  font-size:0.58rem; font-weight:bold; font-style:italic;
  color:#f0c060; background:#1a1a2e; border:1px solid #f0c06055;
  border-radius:3px; padding:0 3px; white-space:nowrap;
  cursor:pointer; z-index:2; line-height:1.5; }
.alt-chord-display:hover { border-color:#f0c060; background:#2a2000; }
.alt-chord-btn { position:absolute; top:-12px; left:1px;
  font-size:0.52rem; color:#6a5a2a; background:none; border:none;
  cursor:pointer; opacity:0; transition:opacity 0.15s; padding:0 2px;
  line-height:1; z-index:2; }
.chord-slot:hover .alt-chord-btn { opacity:0.8; }
.alt-chord-btn:hover { opacity:1 !important; color:#f0c060; }
.chord-slot.sym-nc       { background:rgba(200,60,60,0.08); }
.chord-slot.sym-slash    { background:rgba(100,180,255,0.07); }
.sym-display { font-size:1.6rem; font-weight:900; text-align:center; line-height:1; padding:8px 0 4px; user-select:none; }
.sym-repeat  .sym-display { color:#f0c060; }
.sym-repeat2 .sym-display { color:#f0c060; font-size:1.2rem; }
.sym-nc      .sym-display { color:#f87171; letter-spacing:1px; font-size:1rem; }
.sym-slash   .sym-display { color:#7dd3fc; font-size:1.4rem; }
.sym-label   { font-size:0.55rem; color:#666; text-align:center; padding-bottom:2px; }
/* Bouton symbole rapide sur la mesure */
.measure-sym-bar { display:flex; justify-content:flex-end; gap:3px; padding:2px 4px 0; }
.sym-quick-btn { background:none; border:1px solid #2d4a6a; border-radius:3px; color:#4a7aaa; font-size:0.68rem; cursor:pointer; padding:1px 5px; transition:all 0.15s; line-height:1.4; }
.sym-quick-btn:hover { border-color:#f0a500; color:#f0a500; background:rgba(240,165,0,0.1); }
.sym-quick-btn.active-sym { border-color:#f0c060; color:#f0c060; background:rgba(240,192,96,0.12); }
/* Panneau symboles dans la modale */
#modal-sym-panel { background:#0f2035; border:1px solid #2d4a7a; border-radius:6px; padding:8px 10px; margin-bottom:10px; }
#modal-sym-panel label { font-size:0.75rem; color:#f0a500; font-weight:bold; display:block; margin-bottom:6px; }
.modal-sym-grid { display:flex; gap:6px; flex-wrap:wrap; }
.modal-sym-btn { padding:6px 14px; background:#1e3a5f; border:1px solid #3d6aaa; border-radius:5px; color:#eee; cursor:pointer; font-size:0.85rem; font-weight:bold; transition:all 0.15s; }
.modal-sym-btn:hover { border-color:#f0a500; background:rgba(240,165,0,0.12); color:#f0a500; }
.modal-sym-btn.selected { border-color:#f0c060; background:rgba(240,192,96,0.18); color:#f0c060; }
.add-section-btn { min-height:44px; width:100%; margin:8px 0; font-size:1rem; }
.cols-select { width:60px; }
</style>

<style id="css-modals">

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CSS — MODALS
   Overlay, modales accord / annotation / section
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
.overlay { display:none; position:fixed; top:0;left:0;right:0;bottom:0; background:rgba(0,0,0,0.7); z-index:200; align-items:center; justify-content:center; }
.overlay.active { display:flex; }
.modal-box { background:#16213e; border-radius:10px; padding:22px; max-width:95vw; max-height:92vh; overflow-y:auto; }

.modal-row label { min-width:100px; font-size:0.85rem; color:#aaa; }
.chord-btn-grid { display:grid; grid-template-columns:repeat(6,1fr); gap:4px; margin:8px 0; }
.chord-btn { padding:5px; background:#2d4a7a; border:1px solid #3d6a9a; color:#eee; border-radius:3px; cursor:pointer; font-size:0.75rem; text-align:center; transition:background 0.15s; }
.chord-btn:hover,.chord-btn.active { background:#f0a500; color:#1a1a2e; }
.modal-footer { display:flex; gap:8px; justify-content:flex-end; margin-top:14px; }
#annot-modal-box { border:2px solid #a78bfa; width:580px; }

.annot-block-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }

.toggle-btn { padding:4px 12px; border-radius:20px; border:1px solid #3d2a6a; background:#1a1a2e; color:#aaa; cursor:pointer; font-size:0.75rem; transition:all 0.15s; user-select:none; }

.mode-card.selected { border-color:#a78bfa; background:#2a1a5a; }

<style id="css-print">

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   CSS — PRINT
   @media print : thèmes, couleurs, page-break
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */
@media print {
  body { background:white; min-height:0 !important; }
  #toolbar,#print-contrast-bar,.section-actions,.add-measure-btn,.add-section-btn,.chord-annot-icon,.chord-edit-hint,.chord-del-btn,.add-chord-btn { display:none !important; }
  .barline-btn,.nav-add-btn,.bl-popup { display:none !important; }
  .alt-chord-btn { display:none !important; }
  .alt-chord-display { color:#444 !important; background:white !important;
    border-color:#aaa !important; top:-13px; }
  .nav-symbol { color:#000 !important; background:white !important; border-color:#000 !important; }
  .volta-bracket { border-color:#000 !important; color:#000 !important; }
  #chart-editor { display:block !important; padding:8px 12px 0; }
  #dropzone { display:none !important; }
  /* Hide annotation input row (edit zone) — always */
  .section-annot-row { display:none !important; }
  /* Hide annotation display block when empty */
  .section-annot-display[style*="display:none"] { display:none !important; }
  /* Remove dashed underline / pointer on section label (not editable) */
  .section-label { border-bottom:none !important; cursor:default !important; }
  .section-label::after { content:'' !important; }
  .sec-label-edit { display:none !important; }
  /* Hide chord duration and measure numbers (clutter) */
  .chord-duration { display:none !important; }
  .measure-number { display:none !important; }
  #chart-header { margin-bottom:6px !important; }
  #chart-title { font-size:1.4rem !important; border-bottom:1px solid #ccc !important; padding-bottom:2px !important; }
  #chart-meta { margin-top:4px !important; font-size:0.78rem !important; gap:10px !important; }
  #chart-meta input { font-size:0.78rem !important; }
  .section { border:2px solid #000; background:white;
    page-break-inside:avoid; break-inside:avoid;
    overflow:visible !important;
    margin-bottom:14px; border-radius:0 !important; }
  .section-header { background:#ddd; }
  .section-label { color:#000; }
  /* Passer le grid en flex-wrap à l'impression — display:grid empêche break-inside sur les enfants */
  .measures-grid {
    display:flex !important;
    flex-wrap:wrap !important;
    padding:8px !important;
    gap:4px !important;
    align-items:stretch;
  }
  /* Largeurs des mesures selon le nombre de colonnes (data-cols) */
  .measures-grid[data-cols="1"] .measure { width:calc(100% - 4px) !important; }
  .measures-grid[data-cols="2"] .measure { width:calc(50% - 4px) !important; }
  .measures-grid[data-cols="3"] .measure { width:calc(33.333% - 4px) !important; }
  .measures-grid[data-cols="4"] .measure { width:calc(25% - 4px) !important; }
  /* Fallback si data-cols absent */
  .measures-grid:not([data-cols]) .measure { width:calc(25% - 4px) !important; }
  .measure {
    background:white; border:1.5px solid #333;
    page-break-inside:avoid; break-inside:avoid;
    flex-shrink:0; box-sizing:border-box;
  }
  .chord-symbol { color:#000!important; font-size:1.1rem; }
  .sym-display { color:#000!important; font-size:1.4rem; }
  .sym-label { display:none; }
  .sym-repeat, .sym-repeat2, .sym-nc, .sym-slash { background:transparent !important; }
  .mode-val { color:#000 !important; font-weight:bold !important; font-style:normal !important; }
  .barline-repeat-start { border-left-color:#000; }
  .barline-repeat-end   { border-right-color:#000; }
  /* Mode name in SVG diagram → black bold */
  .mode-diagram-wrap svg text[text-anchor="middle"] { fill:#000 !important; font-weight:bold !important; }
  /* String labels G D A E → black, but circle note texts → white */
  .mode-diagram-wrap svg > text { fill:#000 !important; }
  .mode-diagram-wrap svg g text { fill:#fff !important; }
  /* SVG lines → dark */
  .mode-diagram-wrap svg line { stroke:#333 !important; }
  /* Diagram background → white */
  .mode-diagram-wrap { background:#fff !important; }
}
</style>

</head>

// Map mode display names to SVG keys (covers all language variants)
const MODE_NAME_TO_SVG = {
  // Ionien / Ionian
  'Ionien':'Ionien','Ionian':'Ionien',
  // Dorien / Dorian
  'Dorien':'Dorien','Dorian':'Dorien',
  // Phrygien / Phrygian
  'Phrygien':'Phrygien','Phrygian':'Phrygien',
  // Lydien / Lydian (includes Lydien b7)
  'Lydien':'Lydien','Lydian':'Lydien','Lydien augmenté':'LydienAugmente','Lydien b7':'LydienB7',
  // Mixolydien / Mixolydian
  'Mixolydien':'Mixolydien','Mixolydian':'Mixolydien','Mixolydien b9b13':'MixolydienB9B13',
  // Éolien / Aeolian
  'Éolien':'Aeolien','Aeolian':'Aeolien','Mélo. mineure':'MelodieMineure',
  // Locrien / Locrian
  'Locrien':'Locrien','Locrian':'Locrien','Locrien #2':'LocrienDiese2',
  // Altéré -> Phrygien (closest visual)
  'Altéré':'Altere',
  // Dim
  'Dim. ton-demi':'DimTonDemi','Dim. demi-ton':'DimDemiTon',
  // Tons entiers -> no exact, use Lydien
  'Tons entiers':'TonsEntiers',
  'Mélodie mineure':'MelodieMineure',
};


// Transpose mode SVG: replaces string labels (G, D, A, E) and inserts root info
// Actually just adds the chord root note above the SVG title
function transposeModesvg(svgStr, root, modeName, quality) {
  if(!root || !modeName) return svgStr;
  // Find mode intervals
  let modeIntervals = null;
  for(const q in MODES_DEF) {
    const found = MODES_DEF[q].find(m => m.name === modeName);
    if(found) { modeIntervals = found.i; break; }
  }
  if(!modeIntervals) return svgStr;
  // Build degree→note map
  const degreeToNote = {};
  modeIntervals.forEach((s, idx) => { degreeToNote[idx+1] = tr(root, s); });
  // Build set of arpeggio notes for this chord quality
  const arpDef = ARP_DEF[quality] || ARP_DEF['maj7'];
  const arpNotes = new Set(arpDef.i.map(s => tr(root, s % 12)));
  // Root note
  const rootNote = tr(root, 0);
  // Colors: root=red, other arp notes=amber, scale notes=blue
  return svgStr.replace(/(<circle\b[^>]*fill=")[^"]*("[^>]*\/>)\s*(<text\b[^>]*>)(\d+)(<\/text>)/g,
    (m, pre, post, open, deg, close) => {
      const note = degreeToNote[parseInt(deg)] || deg;
      let color;
      if(note === rootNote)       color = '#e63946'; // root → red
      else if(arpNotes.has(note)) color = '#f0a500'; // arp  → amber
      else                        color = '#4a6fa5'; // scale→ blue
      return pre + color + post + open + note + close;
    });
}

function getModesvg(modeName) {
  const key = MODE_NAME_TO_SVG[modeName];
  return key ? MODE_SVGS[key] : null;
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   JS — THEORY ENGINE
   Gammes, arpèges, tensions, helpers chromatiques
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */


const CHROMATIC=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const ENH={'C#':'Db','D#':'Eb','F#':'Gb','G#':'Ab','A#':'Bb','Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'};
const ALL_KEYS=['C','Db','D','Eb','E','F','F#','Gb','G','Ab','A','Bb','B'];
function noteIdx(n){const i=CHROMATIC.indexOf(n);return i!==-1?i:(ENH[n]?CHROMATIC.indexOf(ENH[n]):-1);}
function tr(root,s){const idx=noteIdx(root);if(idx===-1)return'?';const r=CHROMATIC[(idx+s+12)%12];return['F','Bb','Eb','Ab','Db','Gb'].includes(root)&&ENH[r]?ENH[r]:r;}
function trToKey(note,s,destKey){const idx=noteIdx(note);if(idx===-1)return'?';const r=CHROMATIC[(idx+s+12)%12];return['F','Bb','Eb','Ab','Db','Gb','Cb'].includes(destKey)&&ENH[r]?ENH[r]:r;}

function parseMusicXML(xmlStr){const doc=new DOMParser().parseFromString(xmlStr,'application/xml');const te=doc.querySelector('work-title,movement-title');const title=te?te.textContent.trim():'Thème';let tempo=120;const se=doc.querySelector('sound[tempo]');if(se)tempo=parseInt(se.getAttribute('tempo'));let ts='4/4';const b=doc.querySelector('beats'),bt=doc.querySelector('beat-type');if(b&&bt)ts=`${b.textContent}/${bt.textContent}`;const bpm=parseInt(ts.split('/')[0])||4;let key='C';const fi=doc.querySelector('fifths');if(fi){const f=parseInt(fi.textContent);const km={0:'C',1:'G',2:'D',3:'A',4:'E',5:'B',6:'F#','-1':'F','-2':'Bb','-3':'Eb','-4':'Ab','-5':'Db','-6':'Gb'};key=km[f]||'C';}

function openModal(si,mi,ci,chord){
  editTarget={si,mi,ci};selectedExts=[];

  const activeSymBtn=document.querySelector(`.modal-sym-btn[data-sym="${isSpec?sym:''}"]`);
  if(activeSymBtn)activeSymBtn.classList.add('selected');
  if(chord&&chord.symbol&&!isSpec){
    const rm=chord.symbol.match(/^([A-G][#b]?)/);
    if(rm){selectedRoot=rm[1];const btn=document.querySelector(`#root-btns .chord-btn[data-val="${selectedRoot}"]`);if(btn)btn.classList.add('active');}
    document.getElementById('free-chord').value=chord.symbol;

  }else{
    document.getElementById('free-chord').value=isSpec?sym:'';
    document.getElementById('bass-input').value='';

    if(!isSpec){
      const dr=document.querySelector('#root-btns .chord-btn[data-val="C"]');if(dr)dr.classList.add('active');
      const dq=document.querySelector('#quality-btns .chord-btn[data-val="maj7"]');if(dq)dq.classList.add('active');
      selectedRoot='C';selectedQuality='maj7';
    }
  }
  document.getElementById('modal-title').textContent=ci===-1?t('modalAddChord'):t('modalEditChord');
  document.getElementById('modal-overlay').classList.add('active');
}
function closeModal(){document.getElementById('modal-overlay').classList.remove('active');editTarget=null;}
function buildChordSymbol(){
  // Symbole spécial sélectionné ?
  const selSym=document.querySelector('.modal-sym-btn.selected');
  if(selSym&&selSym.dataset.sym!=='')return selSym.dataset.sym;
  const free=document.getElementById('free-chord').value.trim();
  if(free)return free;
  const bass=document.getElementById('bass-input').value.trim();
  let sym=selectedRoot+selectedQuality;
  if(selectedExts.length>0)sym+='('+selectedExts.join(',')+')';
  if(bass)sym+='/'+bass;
  return sym;

    '13':    {kind:'dominant-13th',text:'13'},
    'dim':   {kind:'diminished',   text:'dim'},
    'dim7':  {kind:'diminished-seventh',text:'dim7'},
    'm7b5':  {kind:'half-diminished',text:'m7b5'},
    'aug':   {kind:'augmented',    text:'aug'},
    'sus2':  {kind:'suspended-second',text:'sus2'},
    'sus4':  {kind:'suspended-fourth',text:'sus4'},
    '7sus4': {kind:'suspended-fourth',text:'7sus4'},
  };
  function parseChordForXML(sym){
    if(!sym||sym==='%'||sym==='–')return null;
    const sp=sym.split('/'),main=sp[0],bn=sp[1]||null;
    const rm=main.match(/^([A-G][#b]?)(.*)/);
    if(!rm)return null;
    const root=rm[1],qual=rm[2].replace(/[()]/g,'');
    let rs=root[0],ra=0;
    if(root[1]==='#')ra=1; else if(root[1]==='b')ra=-1;
    let bs=null,ba=0;
    if(bn){bs=bn[0];if(bn[1]==='#')ba=1;else if(bn[1]==='b')ba=-1;}
    const kd=qToK[qual]||{kind:'other',text:qual};
    return{rs,ra,kind:kd.kind,kt:kd.text,bs,ba};
  }
  function harmonyToXML(chord,offset){
    const p=parseChordForXML(chord.symbol);
    if(!p)return'';
    const alter=v=>v!==0?`<root-alter>${v}</root-alter>`:''
    const bass=p.bs?`<bass><bass-step>${p.bs}</bass-step>${p.ba!==0?`<bass-alter>${p.ba}</bass-alter>`:''}</bass>`:'';
    const off=offset>0?`<offset>${offset*DIVISIONS}</offset>`:'';
    let xml=`\n      <harmony placement="above">${off}<root><root-step>${p.rs}</root-step>${alter(p.ra)}</root><kind text="${p.kt}">${p.kind}</kind>${bass}</harmony>`;
    // ── Accord alternatif ──
    if(chord.altChord){
      const pa=parseChordForXML(chord.altChord);
      if(pa){
        const altBass=pa.bs?`<bass><bass-step>${pa.bs}</bass-step>${pa.ba!==0?`<bass-alter>${pa.ba}</bass-alter>`:''}</bass>`:'';
        xml+=`\n      <harmony placement="above" print-frame="no">${off}<root><root-step>${pa.rs}</root-step>${alter(pa.ra)}</root><kind text="${pa.kt}">${pa.kind}</kind>${altBass}<footnote>alt</footnote></harmony>`;
      }
    }
    return xml;
  }
  // Duration type map: beats → MusicXML type (assuming quarter=1)
  function beatType2xml(b){
    const m={0.25:'16th',0.5:'eighth',1:'quarter',2:'half',3:'dotted-half',4:'whole'};
    return m[b]||'quarter';
  }
  let mn=1,mXML='',isFirst=true;
  chartData.sections.forEach(section=>{
    section.measures.forEach((measure,mi)=>{
      const chords=measure.chords||[];
      let hXML='',ob=0;
      chords.forEach(c=>{hXML+=harmonyToXML(c,ob);ob+=c.beats||beats;});

      // ── Barlines (nouvelles + rétrocompat) ──
      const bl=measure.barlineLeft||(measure.repeatStart?'repeat-start':'normal');
      const br=measure.barlineRight||(measure.repeatEnd?'repeat-end':'normal');
      const blXML={
        'normal':   '',
        'double':   `\n      <barline location="left"><bar-style>light-light</bar-style></barline>`,
        'final':    `\n      <barline location="left"><bar-style>light-heavy</bar-style></barline>`,
        'repeat-start': `\n      <barline location="left"><bar-style>heavy-light</bar-style><repeat direction="forward"/></barline>`,
      };
      const brXML={
        'normal':   '',
        'double':   `\n      <barline location="right"><bar-style>light-light</bar-style></barline>`,
        'final':    `\n      <barline location="right"><bar-style>light-heavy</bar-style></barline>`,
        'repeat-end': `\n      <barline location="right"><bar-style>light-heavy</bar-style><repeat direction="backward"/></barline>`,
      };
      let bStart=blXML[bl]||'';
      let bEnd  =brXML[br]||'';

      // ── Volta (ending) ──
      if(measure.volta){
        bStart+=`\n      <barline location="left"><ending number="${measure.volta}" type="start"/></barline>`;
        bEnd  +=`\n      <barline location="right"><ending number="${measure.volta}" type="stop"/></barline>`;
      }

      // ── Symboles de navigation ──
      let navXML='';
      const nav=measure.navSymbol;
      if(nav==='segno')
        navXML=`\n      <direction placement="above"><direction-type><segno/></direction-type></direction>`;
      else if(nav==='coda')
        navXML=`\n      <direction placement="above"><direction-type><coda/></direction-type></direction>`;
      else if(nav==='fermata')
        navXML=`\n      <direction placement="above"><direction-type><fermata/></direction-type></direction>`;
      else if(NAV_XML_WORDS[nav])
        navXML=`\n      <direction placement="above"><direction-type><words>${NAV_XML_WORDS[nav]}</words></direction-type><sound ${nav==='dc-coda'||nav==='ds-coda'?'dacapo="yes"':nav==='dc-fine'?'dacapo="yes"':'fine="yes"'}/></direction>`;

      let rehearsal='';
      if(mi===0&&section.label){
        rehearsal=`\n      <direction placement="above"><direction-type><rehearsal enclosure="box">${escHtml(section.label)}</rehearsal></direction-type></direction>`;
        if(section.annotation)rehearsal+=`\n      <direction placement="above"><direction-type><words>${escHtml(section.annotation)}</words></direction-type></direction>`;
      }
      let attrs='';
      if(isFirst){
        attrs=`\n      <attributes>`+
          `<divisions>${DIVISIONS}</divisions>`+
          `<key><fifths>${fifths}</fifths><mode>${keyMode}</mode></key>`+
          `<time><beats>${beats}</beats><beat-type>${beatType}</beat-type></time>`+
          `<clef><sign>G</sign><line>2</line></clef>`+
          `</attributes>`+
          `\n      <direction placement="above"><direction-type>`+
          `<metronome parentheses="no"><beat-unit>quarter</beat-unit><per-minute>${chartData.tempo}</per-minute></metronome>`+
          `</direction-type><sound tempo="${chartData.tempo}"/></direction>`;
        isFirst=false;
      }
      const restDur=beats*DIVISIONS;
      mXML+=`\n    <measure number="${mn++}">${bStart}${attrs}${rehearsal}${navXML}${hXML}`+
        `\n      <note><rest measure="yes"/><duration>${restDur}</duration></note>${bEnd}`+
        `\n    </measure>`;
    });
  });
  const title=escHtml(chartData.title||'Jazz Chart');
  const today=new Date().toISOString().split('T')[0];
  return `<?xml version="1.0" encoding="UTF-8" standalone="no"?>\n`+
    `<!DOCTYPE score-partwise PUBLIC "-//Recordare//DTD MusicXML 3.1 Partwise//EN"\n`+
    `  "http://www.musicxml.org/dtds/partwise.dtd">\n`+
    `<score-partwise version="3.1">\n`+
    `  <work><work-title>${title}</work-title></work>\n`+
    `  <identification>\n`+
    `    <encoding>\n`+
    `      <software>Jazz Chart Editor v4</software>\n`+
    `      <encoding-date>${today}</encoding-date>\n`+
    `      <supports element="accidental" type="no"/>\n`+
    `      <supports element="beam" type="no"/>\n`+
    `    </encoding>\n`+
    `  </identification>\n`+
    `  <part-list><score-part id="P1"><part-name>${title}</part-name></score-part></part-list>\n`+
    `  <part id="P1">${mXML}\n  </part>\n`+
    `</score-partwise>`;
}

  const a=document.createElement('a');

async function exportMXL(){
  if(typeof JSZip==='undefined'){alert('JSZip not loaded');return;}
  const xml=buildMusicXMLString();
  const title=(chartData.title||'chart').replace(/\s+/g,'_');
  const xmlFilename=title+'.xml';
  // container.xml required by MXL spec
  const container=`<?xml version="1.0" encoding="UTF-8"?>\n`+
    `<container>\n`+
    `  <rootfiles>\n`+
    `    <rootfile full-path="${xmlFilename}" media-type="application/vnd.recordare.musicxml+xml"/>\n`+
    `  </rootfiles>\n`+
    `</container>`;
  const zip=new JSZip();
  zip.folder('META-INF').file('container.xml',container);
  zip.file(xmlFilename,xml);
  // mimetype file (uncompressed, must be first) — JSZip handles ordering
  zip.file('mimetype','application/vnd.recordare.musicxml',{compression:'STORE'});
  const blob=await zip.generateAsync({type:'blob',compression:'DEFLATE',compressionOptions:{level:6}});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=title+'.mxl';
  a.click();
}

async function loadFileAsXML(file){
  return new Promise((resolve,reject)=>{
    const ext=file.name.split('.').pop().toLowerCase();
    if(ext==='mxl'){
      if(typeof JSZip==='undefined'){reject(new Error('JSZip not loaded'));return;}
      const r=new FileReader();
      r.onload=async ev=>{
        try{
          const zip=await JSZip.loadAsync(ev.target.result);
          // Find rootfile from META-INF/container.xml
          let xmlPath=null;
          const containerFile=zip.file('META-INF/container.xml');
          if(containerFile){
            const containerXml=await containerFile.async('string');
            const m=containerXml.match(/full-path="([^"]+)"/);
            if(m)xmlPath=m[1];
          }
          // Fallback: find first .xml or .musicxml in zip
          if(!xmlPath){
            zip.forEach((p,f)=>{if(!xmlPath&&(p.endsWith('.xml')||p.endsWith('.musicxml'))&&!p.startsWith('META-INF'))xmlPath=p;});
          }
          if(!xmlPath){reject(new Error('No MusicXML found in MXL'));return;}
          const xmlStr=await zip.file(xmlPath).async('string');
          resolve(xmlStr);
        }catch(e){reject(e);}
      };
      r.onerror=()=>reject(new Error('Read failed'));
      r.readAsArrayBuffer(file);
    } else {
      const r=new FileReader();
      r.onload=ev=>resolve(ev.target.result);
      r.onerror=()=>reject(new Error('Read failed'));
      r.readAsText(file);
    }
  });
}

/* ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
   JS — KEY MODES PANEL
   Affiche les 7 modes de la gamme majeure ou mineure naturelle
   ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━ */

const KMP_CHROMATIC_SHARP=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const KMP_CHROMATIC_FLAT= ['C','Db','D','Eb','E','F','Gb','G','Ab','A','Bb','B'];
// Tonalités dont le root utilise les bémols
const KMP_FLAT_ROOTS=['F','Bb','Eb','Ab','Db','Gb','Cb'];
// Tonalités mineures bémols
const KMP_FLAT_MINOR_ROOTS=['Dm','Gm','Cm','Fm','Bbm','Ebm','Abm'];

// Gamme majeure : intervalles depuis la tonique
const KMP_MAJOR_IV=[0,2,4,5,7,9,11];
// Gamme mineure naturelle (éolienne) : intervalles depuis la tonique
const KMP_MINOR_IV=[0,2,3,5,7,8,10];

// 7 modes de la gamme MAJEURE (I→VII)
const KMP_MODES_MAJ=[
  {name:'Ionien',     degree:'I',   chord:'maj7',  color:'#f0a500'},
  {name:'Dorien',     degree:'II',  chord:'m7',    color:'#7dd3fc'},
  {name:'Phrygien',   degree:'III', chord:'m7',    color:'#86efac'},
  {name:'Lydien',     degree:'IV',  chord:'maj7',  color:'#fcd34d'},
  {name:'Mixolydien', degree:'V',   chord:'7',     color:'#fb923c'},
  {name:'Éolien',     degree:'VI',  chord:'m7',    color:'#c4b5fd'},
  {name:'Locrien',    degree:'VII', chord:'m7b5',  color:'#fca5a5'},
];

// 7 modes de la gamme MINEURE naturelle (I→VII)
const KMP_MODES_MIN=[
  {name:'Éolien',     degree:'I',   chord:'m7',    color:'#c4b5fd'},
  {name:'Locrien',    degree:'II',  chord:'m7b5',  color:'#fca5a5'},
  {name:'Ionien',     degree:'III', chord:'maj7',  color:'#f0a500'},
  {name:'Dorien',     degree:'IV',  chord:'m7',    color:'#7dd3fc'},
  {name:'Phrygien',   degree:'V',   chord:'m7',    color:'#86efac'},
  {name:'Lydien',     degree:'VI',  chord:'maj7',  color:'#fcd34d'},
  {name:'Mixolydien', degree:'VII', chord:'7',     color:'#fb923c'},
];

const KMP_LABEL_MAJ={fr:'majeur',en:'major',es:'mayor',it:'maggiore'};
const KMP_MODE_LABELS={fr:'Modes de la tonalité',en:'Key modes',es:'Modos de la tonalidad',it:'Modi della tonalità'};

function updateKeyModesPanel(key){
  const panel=document.getElementById('key-modes-panel');
  const grid=document.getElementById('key-modes-grid');
  const lbl=document.getElementById('key-modes-label');
  if(!key||!key.trim()){panel.style.display='none';return;}

  // Détecter mineur : tonalité se terminant par 'm' (ex: Am, Dm, F#m, Bbm)
  const isMinor=/^[A-G][b#]?m$/.test(key.trim());
  const rootName=isMinor?key.trim().slice(0,-1):key.trim();

  // Choisir la gamme chromatique (dièses ou bémols)
  const useFlat=isMinor?KMP_FLAT_MINOR_ROOTS.includes(key.trim()):KMP_FLAT_ROOTS.includes(rootName);
  const chromatic=useFlat?KMP_CHROMATIC_FLAT:KMP_CHROMATIC_SHARP;
  const rootIdx=chromatic.indexOf(rootName);
  if(rootIdx===-1){panel.style.display='none';return;}

  const intervals=isMinor?KMP_MINOR_IV:KMP_MAJOR_IV;
  const modes=isMinor?KMP_MODES_MIN:KMP_MODES_MAJ;
  const scaleNotes=intervals.map(iv=>chromatic[(rootIdx+iv)%12]);

  grid.innerHTML='';
  modes.forEach((mode,i)=>{
    const note=scaleNotes[i];
    const isTonic=(i===0);
    const pill=document.createElement('div');
    pill.className='key-mode-pill'+(isTonic?' kmp-tonic':'');
    pill.innerHTML=`
      <div class="kmp-degree">${mode.degree}</div>
      <div class="kmp-note" style="color:${mode.color}">${note}</div>
      <div class="kmp-name">${mode.name}</div>
      <div class="kmp-chord">${note}${mode.chord}</div>
    `;
    grid.appendChild(pill);
  });

  const qualLabel=isMinor?'':(KMP_LABEL_MAJ[currentLang]||KMP_LABEL_MAJ.fr);
  const fixedText=(KMP_MODE_LABELS[currentLang]||KMP_MODE_LABELS.fr).toUpperCase();
  lbl.innerHTML=`<span style="text-transform:uppercase">${fixedText}</span> — <span style="text-transform:none">${key}${qualLabel?' '+qualLabel:''}</span>`;
  panel.style.display='block';
}

function updateTimestamp(){const n=new Date();const pad=v=>String(v).padStart(2,'0');const ts=String(n.getFullYear()).slice(2)+pad(n.getMonth()+1)+pad(n.getDate())+pad(n.getHours())+pad(n.getMinutes())+pad(n.getSeconds());document.getElementById('toolbar-ts').textContent=ts;document.getElementById('print-ts').textContent=ts;}
updateTimestamp();
setInterval(updateTimestamp,1000);
