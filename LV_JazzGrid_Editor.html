<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jazz Chart Editor</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Georgia', serif;
    background: #1a1a2e;
    color: #eee;
    min-height: 100vh;
  }

  /* TOOLBAR */
  #toolbar {
    background: #16213e;
    padding: 12px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    border-bottom: 2px solid #f0a500;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  #toolbar h1 {
    font-size: 1.2rem;
    color: #f0a500;
    margin-right: 10px;
  }
  .btn {
    background: #f0a500;
    color: #1a1a2e;
    border: none;
    padding: 7px 14px;
    border-radius: 4px;
    cursor: pointer;
    font-weight: bold;
    font-size: 0.85rem;
    transition: background 0.2s;
  }
  .btn:hover { background: #ffc107; }
  .btn.secondary {
    background: #2d4a7a;
    color: #eee;
  }
  .btn.secondary:hover { background: #3a5f9a; }
  .btn.danger {
    background: #c0392b;
    color: #fff;
  }
  select, input[type="text"], input[type="number"] {
    background: #2d4a7a;
    color: #eee;
    border: 1px solid #f0a500;
    padding: 6px 10px;
    border-radius: 4px;
    font-size: 0.85rem;
  }
  label { font-size: 0.85rem; color: #aaa; }

  /* DROP ZONE */
  #dropzone {
    border: 3px dashed #f0a500;
    border-radius: 12px;
    margin: 40px auto;
    max-width: 500px;
    padding: 60px 40px;
    text-align: center;
    cursor: pointer;
    transition: background 0.2s;
  }
  #dropzone:hover, #dropzone.drag-over { background: rgba(240,165,0,0.1); }
  #dropzone p { color: #aaa; margin-top: 10px; font-size: 0.9rem; }
  #dropzone .icon { font-size: 3rem; }
  #file-input { display: none; }

  /* CHART EDITOR */
  #chart-editor { display: none; padding: 20px; }

  #chart-header {
    text-align: center;
    margin-bottom: 20px;
  }
  #chart-title {
    font-size: 2rem;
    font-weight: bold;
    color: #f0a500;
    border: none;
    background: transparent;
    text-align: center;
    width: 100%;
    outline: none;
    border-bottom: 1px dashed #555;
  }
  #chart-meta {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin-top: 8px;
    flex-wrap: wrap;
    font-size: 0.9rem;
    color: #aaa;
  }
  #chart-meta input {
    width: 120px;
    text-align: center;
  }

  /* SECTIONS */
  .section {
    margin-bottom: 30px;
    background: #16213e;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid #2d4a7a;
  }
  .section-header {
    background: #0f3460;
    padding: 8px 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-label {
    font-weight: bold;
    color: #f0a500;
    font-size: 0.9rem;
    border: none;
    background: transparent;
    outline: none;
    width: 120px;
  }
  .section-actions {
    margin-left: auto;
    display: flex;
    gap: 6px;
  }
  .section-actions button {
    background: none;
    border: 1px solid #555;
    color: #aaa;
    padding: 3px 8px;
    border-radius: 3px;
    cursor: pointer;
    font-size: 0.75rem;
  }
  .section-actions button:hover { border-color: #f0a500; color: #f0a500; }

  /* MEASURES GRID */
  .measures-grid {
    display: grid;
    padding: 12px;
    gap: 6px;
  }
  .measure {
    background: #1e3a5f;
    border: 1px solid #2d5a8a;
    border-radius: 4px;
    min-height: 70px;
    padding: 4px;
    position: relative;
    cursor: pointer;
    transition: border-color 0.2s;
  }
  .measure:hover { border-color: #f0a500; }
  .measure.selected { border-color: #f0a500; border-width: 2px; background: #1e4a6f; }
  .measure-number {
    position: absolute;
    top: 2px;
    left: 4px;
    font-size: 0.65rem;
    color: #556;
    user-select: none;
  }
  .measure-beats {
    display: flex;
    height: 100%;
    gap: 2px;
    padding-top: 14px;
    align-items: center;
  }
  .beat {
    flex: 1;
    text-align: center;
  }
  .chord-symbol {
    font-size: 1.1rem;
    font-weight: bold;
    color: #eee;
    line-height: 1.2;
  }
  .chord-duration {
    font-size: 0.65rem;
    color: #88a;
  }
  .beat.empty .chord-symbol { color: #556; }

  /* BARLINE */
  .barline-start {
    border-left: 2px solid #aaa;
    padding-left: 4px;
  }
  .barline-repeat-start {
    border-left: 4px double #f0a500;
    padding-left: 4px;
  }
  .barline-repeat-end {
    border-right: 4px double #f0a500;
    padding-right: 4px;
  }

  /* CHORD EDITOR MODAL */
  #modal-overlay {
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
  }
  #modal-overlay.active { display: flex; }
  #modal {
    background: #16213e;
    border: 2px solid #f0a500;
    border-radius: 10px;
    padding: 24px;
    width: 480px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
  }
  #modal h3 { color: #f0a500; margin-bottom: 16px; }
  .modal-row { display: flex; gap: 8px; align-items: center; margin-bottom: 8px; flex-wrap: wrap; }
  .modal-row label { min-width: 100px; font-size: 0.85rem; color: #aaa; }
  .chord-btn-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 4px;
    margin: 8px 0;
  }
  .chord-btn {
    padding: 5px;
    background: #2d4a7a;
    border: 1px solid #3d6a9a;
    color: #eee;
    border-radius: 3px;
    cursor: pointer;
    font-size: 0.75rem;
    text-align: center;
    transition: background 0.15s;
  }
  .chord-btn:hover, .chord-btn.active { background: #f0a500; color: #1a1a2e; }
  .modal-footer { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }

  /* ADD BUTTONS */
  .add-measure-btn, .add-section-btn {
    border: 2px dashed #2d5a8a;
    background: none;
    color: #2d5a8a;
    border-radius: 4px;
    min-height: 70px;
    cursor: pointer;
    font-size: 1.4rem;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
  }
  .add-measure-btn:hover, .add-section-btn:hover {
    border-color: #f0a500;
    color: #f0a500;
  }
  .add-section-btn {
    min-height: 44px;
    width: 100%;
    margin: 8px 0;
    font-size: 1rem;
  }

  /* PRINT */
  @media print {
    body { background: white; color: black; }
    #toolbar { display: none; }
    .section-actions { display: none; }
    .add-measure-btn, .add-section-btn { display: none; }
    #dropzone { display: none; }
    .section { border: 1px solid #ccc; background: white; }
    .section-header { background: #eee; }
    .section-label { color: #333; }
    .measure { background: white; border: 1px solid #ccc; }
    .chord-symbol { color: black; }
    .measure-number { color: #999; }
  }

  /* COLS SELECTOR */
  .cols-select { width: 60px; }
</style>
</head>
<body>

<div id="toolbar">
  <h1>🎷 Jazz Chart</h1>
  <input type="file" id="file-input" accept=".musicxml,.xml">
  <button class="btn" onclick="document.getElementById('file-input').click()">📂 Ouvrir MusicXML</button>
  <button class="btn secondary" onclick="newChart()">✨ Nouveau</button>
  <span style="flex:1"></span>
  <label>Colonnes: </label>
  <select class="cols-select" id="global-cols" onchange="updateAllCols()">
    <option value="4" selected>4</option>
    <option value="3">3</option>
    <option value="2">2</option>
    <option value="1">1</option>
  </select>
  <button class="btn secondary" onclick="window.print()">🖨️ Imprimer</button>
  <button class="btn" onclick="exportJSON()">💾 Export JSON</button>
  <input type="file" id="import-json" accept=".json" style="display:none">
  <button class="btn secondary" onclick="document.getElementById('import-json').click()">📥 Import JSON</button>
</div>

<div id="dropzone" onclick="document.getElementById('file-input').click()">
  <div class="icon">🎵</div>
  <h2>Déposer un fichier MusicXML</h2>
  <p>ou cliquer pour choisir un fichier .musicxml / .xml</p>
</div>

<div id="chart-editor">
  <div id="chart-header">
    <input id="chart-title" type="text" value="Mon Thème Jazz" placeholder="Titre du thème">
    <div id="chart-meta">
      <span>Tonalité: <input type="text" id="meta-key" value="C" style="width:60px"></span>
      <span>Tempo: <input type="number" id="meta-tempo" value="120" style="width:70px"> BPM</span>
      <span>Mesure: <input type="text" id="meta-time" value="4/4" style="width:60px"></span>
      <span>Style: <input type="text" id="meta-style" value="Swing" style="width:100px"></span>
    </div>
  </div>
  <div id="sections-container"></div>
  <button class="add-section-btn" onclick="addSection()">+ Ajouter une section</button>
</div>

<!-- MODAL -->
<div id="modal-overlay">
  <div id="modal">
    <h3 id="modal-title">Éditer l'accord</h3>
    <div style="margin-bottom:12px;">
      <label style="color:#f0a500;font-size:0.8rem;">FONDAMENTALE</label>
      <div class="chord-btn-grid" id="root-btns"></div>
    </div>
    <div style="margin-bottom:12px;">
      <label style="color:#f0a500;font-size:0.8rem;">QUALITÉ</label>
      <div class="chord-btn-grid" id="quality-btns"></div>
    </div>
    <div style="margin-bottom:12px;">
      <label style="color:#f0a500;font-size:0.8rem;">TENSIONS / OPTIONS</label>
      <div class="chord-btn-grid" id="ext-btns"></div>
    </div>
    <div class="modal-row">
      <label>Basse (slash):</label>
      <input type="text" id="bass-input" placeholder="ex: G" style="width:70px">
      <button class="chord-btn" onclick="document.getElementById('bass-input').value=''">Effacer</button>
    </div>
    <div class="modal-row">
      <label>Accord libre:</label>
      <input type="text" id="free-chord" placeholder="ex: Cmaj7#11" style="flex:1">
    </div>
    <div class="modal-row">
      <label>Durée (temps):</label>
      <input type="number" id="chord-beats" min="1" max="8" value="4" style="width:70px">
    </div>
    <div class="modal-footer">
      <button class="btn danger" onclick="deleteChord()">🗑 Supprimer</button>
      <button class="btn secondary" onclick="closeModal()">Annuler</button>
      <button class="btn" onclick="applyChord()">✓ Appliquer</button>
    </div>
  </div>
</div>

<script>
// ========================
// DATA MODEL
// ========================
let chartData = {
  title: 'Mon Thème Jazz',
  key: 'C',
  tempo: 120,
  timeSig: '4/4',
  style: 'Swing',
  sections: []
};

let editingTarget = null; // { sectionIdx, measureIdx, beatIdx }
let selectedRoot = 'C';
let selectedQuality = 'maj7';
let selectedExts = [];

const ROOTS = ['C','C#','Db','D','D#','Eb','E','F','F#','Gb','G','G#','Ab','A','A#','Bb','B'];
const QUALITIES = [
  { label: '', value: '' },
  { label: 'maj7', value: 'maj7' },
  { label: 'maj9', value: 'maj9' },
  { label: 'maj13', value: 'maj13' },
  { label: '6', value: '6' },
  { label: '6/9', value: '6/9' },
  { label: 'm', value: 'm' },
  { label: 'm6', value: 'm6' },
  { label: 'm7', value: 'm7' },
  { label: 'm9', value: 'm9' },
  { label: 'm11', value: 'm11' },
  { label: 'm13', value: 'm13' },
  { label: 'mM7', value: 'mM7' },
  { label: '7', value: '7' },
  { label: '9', value: '9' },
  { label: '11', value: '11' },
  { label: '13', value: '13' },
  { label: 'dim', value: 'dim' },
  { label: 'dim7', value: 'dim7' },
  { label: 'ø7', value: 'm7b5' },
  { label: 'aug', value: 'aug' },
  { label: 'sus2', value: 'sus2' },
  { label: 'sus4', value: 'sus4' },
  { label: '7sus4', value: '7sus4' },
];
const EXTS = ['b5','#5','b9','#9','#11','b13','add9','add11','omit3'];

// ========================
// MUSICXML PARSER
// ========================
function parseMusicXML(xmlStr) {
  const parser = new DOMParser();
  const doc = parser.parseFromString(xmlStr, 'application/xml');

  // Title
  const titleEl = doc.querySelector('work-title, movement-title');
  const title = titleEl ? titleEl.textContent.trim() : 'Thème';

  // Tempo
  let tempo = 120;
  const tempoEl = doc.querySelector('sound[tempo]');
  if (tempoEl) tempo = parseInt(tempoEl.getAttribute('tempo'));

  // Time sig
  let timeSig = '4/4';
  const beats = doc.querySelector('beats');
  const beatType = doc.querySelector('beat-type');
  if (beats && beatType) timeSig = `${beats.textContent}/${beatType.textContent}`;
  const beatsPerMeasure = parseInt(timeSig.split('/')[0]) || 4;

  // Key
  let key = 'C';
  const fifths = doc.querySelector('fifths');
  if (fifths) {
    const f = parseInt(fifths.textContent);
    const keyMap = {0:'C',1:'G',2:'D',3:'A',4:'E',5:'B',6:'F#','-1':'F','-2':'Bb','-3':'Eb','-4':'Ab','-5':'Db','-6':'Gb'};
    key = keyMap[f] || 'C';
  }

  // Measures + harmonies
  const measures = doc.querySelectorAll('measure');
  const parsedMeasures = [];

  measures.forEach((m, idx) => {
    const mData = { number: idx + 1, chords: [], repeatStart: false, repeatEnd: false };

    // Barlines
    m.querySelectorAll('barline').forEach(bl => {
      const loc = bl.getAttribute('location');
      const repeat = bl.querySelector('repeat');
      if (repeat) {
        if (loc === 'left' || repeat.getAttribute('direction') === 'forward') mData.repeatStart = true;
        if (loc === 'right' || repeat.getAttribute('direction') === 'backward') mData.repeatEnd = true;
      }
    });

    // Harmonies (chords)
    m.querySelectorAll('harmony').forEach(h => {
      const rootEl = h.querySelector('root-step');
      const alterEl = h.querySelector('root-alter');
      const kindEl = h.querySelector('kind');
      const bassEl = h.querySelector('bass-step');
      const bassAlterEl = h.querySelector('bass-alter');

      if (!rootEl) return;
      let root = rootEl.textContent.trim();
      if (alterEl) {
        const a = parseFloat(alterEl.textContent);
        if (a === 1) root += '#';
        if (a === -1) root += 'b';
      }

      let kind = kindEl ? kindEl.getAttribute('text') || kindEl.textContent.trim() : '';
      // Normalize kind
      const kindMap = {
        'major': '', 'minor': 'm', 'dominant': '7', 'major-seventh': 'maj7',
        'minor-seventh': 'm7', 'diminished': 'dim', 'augmented': 'aug',
        'half-diminished': 'm7b5', 'diminished-seventh': 'dim7',
        'major-ninth': 'maj9', 'dominant-ninth': '9', 'minor-ninth': 'm9',
        'dominant-11th': '11', 'major-13th': 'maj13', 'dominant-13th': '13',
        'suspended-second': 'sus2', 'suspended-fourth': 'sus4',
        'minor-major': 'mM7',
      };
      if (kindMap[kind] !== undefined) kind = kindMap[kind];

      let bass = '';
      if (bassEl) {
        bass = bassEl.textContent.trim();
        if (bassAlterEl) {
          const a = parseFloat(bassAlterEl.textContent);
          if (a === 1) bass += '#';
          if (a === -1) bass += 'b';
        }
      }

      // Duration in beats
      let offset = 0;
      const offsetEl = h.querySelector('offset');
      if (offsetEl) offset = parseFloat(offsetEl.textContent);

      const symbol = root + kind + (bass ? '/' + bass : '');
      mData.chords.push({ symbol, beats: 0, offset });
    });

    // Compute durations from offsets
    if (mData.chords.length > 0) {
      // Get divisions per quarter note
      const divEl = m.querySelector('divisions');
      const divisions = divEl ? parseInt(divEl.textContent) : 1;

      // Recalculate from note elements if no offsets
      mData.chords.forEach((c, i) => {
        const next = mData.chords[i + 1];
        // Simple: distribute evenly if no offset info
        c.beats = 0;
      });

      // Distribute beats evenly
      const total = beatsPerMeasure;
      mData.chords.forEach(c => { c.beats = Math.round(total / mData.chords.length); });
      // Fix last
      if (mData.chords.length > 0) {
        const sum = mData.chords.slice(0,-1).reduce((a,c)=>a+c.beats,0);
        mData.chords[mData.chords.length-1].beats = total - sum;
      }
    } else {
      mData.chords.push({ symbol: '%', beats: beatsPerMeasure });
    }

    parsedMeasures.push(mData);
  });

  // Group into one section by default, then try to detect rehearsal marks
  const sections = [];
  let currentSection = { label: 'A', measures: [] };

  measures.forEach((m, idx) => {
    const rehearsal = m.querySelector('rehearsal, direction rehearsal');
    if (rehearsal && idx > 0) {
      if (currentSection.measures.length > 0) sections.push(currentSection);
      currentSection = { label: rehearsal.textContent.trim(), measures: [] };
    }
    currentSection.measures.push(parsedMeasures[idx]);
  });
  if (currentSection.measures.length > 0) sections.push(currentSection);

  return { title, key, tempo, timeSig, style: 'Swing', sections };
}

// ========================
// RENDER
// ========================
function render() {
  document.getElementById('chart-title').value = chartData.title;
  document.getElementById('meta-key').value = chartData.key;
  document.getElementById('meta-tempo').value = chartData.tempo;
  document.getElementById('meta-time').value = chartData.timeSig;
  document.getElementById('meta-style').value = chartData.style;

  const container = document.getElementById('sections-container');
  container.innerHTML = '';

  chartData.sections.forEach((section, si) => {
    container.appendChild(renderSection(section, si));
  });
}

function renderSection(section, si) {
  const cols = parseInt(document.getElementById('global-cols').value) || 4;
  const div = document.createElement('div');
  div.className = 'section';
  div.dataset.si = si;

  // Header
  const header = document.createElement('div');
  header.className = 'section-header';

  const labelInput = document.createElement('input');
  labelInput.className = 'section-label';
  labelInput.value = section.label || '';
  labelInput.placeholder = 'Section...';
  labelInput.addEventListener('change', () => {
    chartData.sections[si].label = labelInput.value;
  });

  const actions = document.createElement('div');
  actions.className = 'section-actions';

  const dupBtn = document.createElement('button');
  dupBtn.textContent = '⧉ Dupliquer';
  dupBtn.onclick = () => duplicateSection(si);

  const delBtn = document.createElement('button');
  delBtn.textContent = '✕ Supprimer';
  delBtn.onclick = () => deleteSection(si);

  const addMBtn = document.createElement('button');
  addMBtn.textContent = '+ Mesure';
  addMBtn.onclick = () => addMeasure(si);

  actions.append(addMBtn, dupBtn, delBtn);
  header.append(labelInput, actions);

  // Grid
  const grid = document.createElement('div');
  grid.className = 'measures-grid';
  grid.style.gridTemplateColumns = `repeat(${cols}, 1fr)`;

  section.measures.forEach((measure, mi) => {
    grid.appendChild(renderMeasure(measure, si, mi));
  });

  // Add measure placeholder
  const addBtn = document.createElement('button');
  addBtn.className = 'add-measure-btn';
  addBtn.textContent = '+';
  addBtn.onclick = () => addMeasure(si);
  grid.appendChild(addBtn);

  div.append(header, grid);
  return div;
}

function renderMeasure(measure, si, mi) {
  const div = document.createElement('div');
  div.className = 'measure';
  if (measure.repeatStart) div.classList.add('barline-repeat-start');
  if (measure.repeatEnd) div.classList.add('barline-repeat-end');

  const num = document.createElement('span');
  num.className = 'measure-number';
  num.textContent = mi + 1;
  div.appendChild(num);

  const beats = document.createElement('div');
  beats.className = 'measure-beats';

  const chords = measure.chords || [];

  if (chords.length === 0) {
    const beat = document.createElement('div');
    beat.className = 'beat empty';
    beat.innerHTML = '<div class="chord-symbol">%</div>';
    beat.onclick = () => openModal(si, mi, -1, null);
    beats.appendChild(beat);
  } else {
    chords.forEach((chord, ci) => {
      const beat = document.createElement('div');
      beat.className = 'beat';
      beat.style.flex = chord.beats || 1;
      beat.innerHTML = `<div class="chord-symbol">${formatChord(chord.symbol)}</div><div class="chord-duration">${chord.beats || ''}♩</div>`;
      beat.onclick = () => openModal(si, mi, ci, chord);
      beats.appendChild(beat);

      // Add chord button (between chords)
      if (ci < chords.length - 1) {
        const sep = document.createElement('div');
        sep.style.cssText = 'width:2px;background:#2d4a7a;border-radius:1px;cursor:col-resize;';
        beats.appendChild(sep);
      }
    });
  }

  // Right-click: add chord in measure
  div.addEventListener('contextmenu', e => {
    e.preventDefault();
    openModal(si, mi, -1, null);
  });

  div.appendChild(beats);

  // Delete measure button on hover
  const delM = document.createElement('button');
  delM.textContent = '✕';
  delM.style.cssText = 'position:absolute;top:2px;right:4px;background:none;border:none;color:#c0392b;font-size:0.7rem;cursor:pointer;opacity:0;transition:opacity 0.2s;';
  delM.onclick = (e) => { e.stopPropagation(); deleteMeasure(si, mi); };
  div.appendChild(delM);
  div.addEventListener('mouseenter', () => delM.style.opacity = '1');
  div.addEventListener('mouseleave', () => delM.style.opacity = '0');

  return div;
}

function formatChord(sym) {
  if (!sym || sym === '%') return '–';
  // Superscript quality
  return sym
    .replace(/maj7/g, 'Δ7')
    .replace(/maj9/g, 'Δ9')
    .replace(/maj13/g, 'Δ13')
    .replace(/m7b5/g, 'ø7')
    .replace(/dim7/g, '°7')
    .replace(/dim/g, '°');
}

// ========================
// MODAL
// ========================
function buildModal() {
  // Roots
  const rootContainer = document.getElementById('root-btns');
  ROOTS.forEach(r => {
    const b = document.createElement('button');
    b.className = 'chord-btn';
    b.textContent = r;
    b.dataset.val = r;
    b.onclick = () => {
      document.querySelectorAll('#root-btns .chord-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      selectedRoot = r;
      document.getElementById('free-chord').value = '';
    };
    rootContainer.appendChild(b);
  });

  // Qualities
  const qualContainer = document.getElementById('quality-btns');
  QUALITIES.forEach(q => {
    const b = document.createElement('button');
    b.className = 'chord-btn';
    b.textContent = q.label || '—';
    b.dataset.val = q.value;
    b.onclick = () => {
      document.querySelectorAll('#quality-btns .chord-btn').forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      selectedQuality = q.value;
      document.getElementById('free-chord').value = '';
    };
    qualContainer.appendChild(b);
  });

  // Extensions
  const extContainer = document.getElementById('ext-btns');
  EXTS.forEach(e => {
    const b = document.createElement('button');
    b.className = 'chord-btn';
    b.textContent = e;
    b.dataset.val = e;
    b.onclick = () => {
      b.classList.toggle('active');
      if (b.classList.contains('active')) {
        if (!selectedExts.includes(e)) selectedExts.push(e);
      } else {
        selectedExts = selectedExts.filter(x => x !== e);
      }
      document.getElementById('free-chord').value = '';
    };
    extContainer.appendChild(b);
  });
}

function openModal(si, mi, ci, chord) {
  editingTarget = { si, mi, ci };
  selectedExts = [];

  // Reset
  document.querySelectorAll('#root-btns .chord-btn, #quality-btns .chord-btn, #ext-btns .chord-btn').forEach(b => b.classList.remove('active'));

  const timeSig = chartData.timeSig || '4/4';
  const beatsPerMeasure = parseInt(timeSig.split('/')[0]) || 4;

  if (chord && chord.symbol && chord.symbol !== '%') {
    // Try to parse chord symbol
    const sym = chord.symbol;
    // Find root
    const rootMatch = sym.match(/^([A-G][#b]?)/);
    if (rootMatch) {
      selectedRoot = rootMatch[1];
      const btn = document.querySelector(`#root-btns .chord-btn[data-val="${selectedRoot}"]`);
      if (btn) btn.classList.add('active');
    }
    document.getElementById('free-chord').value = sym;
    document.getElementById('bass-input').value = sym.includes('/') ? sym.split('/')[1] : '';
    document.getElementById('chord-beats').value = chord.beats || beatsPerMeasure;
  } else {
    document.getElementById('free-chord').value = '';
    document.getElementById('bass-input').value = '';
    document.getElementById('chord-beats').value = beatsPerMeasure;
    // Activate defaults
    const defRoot = document.querySelector(`#root-btns .chord-btn[data-val="C"]`);
    if (defRoot) defRoot.classList.add('active');
    const defQ = document.querySelector(`#quality-btns .chord-btn[data-val="maj7"]`);
    if (defQ) defQ.classList.add('active');
    selectedRoot = 'C'; selectedQuality = 'maj7';
  }

  document.getElementById('modal-title').textContent = ci === -1 ? 'Ajouter un accord' : 'Éditer l\'accord';
  document.getElementById('modal-overlay').classList.add('active');
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
  editingTarget = null;
}

function buildChordSymbol() {
  const free = document.getElementById('free-chord').value.trim();
  if (free) return free;
  const bass = document.getElementById('bass-input').value.trim();
  let sym = selectedRoot + selectedQuality;
  if (selectedExts.length > 0) sym += '(' + selectedExts.join(',') + ')';
  if (bass) sym += '/' + bass;
  return sym;
}

function applyChord() {
  const { si, mi, ci } = editingTarget;
  const symbol = buildChordSymbol();
  const beats = parseInt(document.getElementById('chord-beats').value) || 4;
  const chord = { symbol, beats };

  const measure = chartData.sections[si].measures[mi];
  if (ci === -1) {
    // Add new chord
    if (!measure.chords) measure.chords = [];
    measure.chords.push(chord);
  } else {
    measure.chords[ci] = chord;
  }

  closeModal();
  render();
}

function deleteChord() {
  const { si, mi, ci } = editingTarget;
  if (ci === -1) { closeModal(); return; }
  chartData.sections[si].measures[mi].chords.splice(ci, 1);
  closeModal();
  render();
}

// ========================
// CHART ACTIONS
// ========================
function newChart() {
  chartData = {
    title: 'Mon Thème Jazz',
    key: 'C',
    tempo: 120,
    timeSig: '4/4',
    style: 'Swing',
    sections: [
      {
        label: 'A',
        measures: Array.from({length: 8}, (_,i) => ({
          number: i+1,
          chords: [{ symbol: 'Cmaj7', beats: 4 }],
          repeatStart: false,
          repeatEnd: false
        }))
      }
    ]
  };
  document.getElementById('dropzone').style.display = 'none';
  document.getElementById('chart-editor').style.display = 'block';
  render();
}

function addSection() {
  chartData.sections.push({
    label: 'Section',
    measures: Array.from({length: 4}, (_,i) => ({
      number: i+1,
      chords: [{ symbol: 'Cmaj7', beats: 4 }],
      repeatStart: false,
      repeatEnd: false
    }))
  });
  render();
}

function duplicateSection(si) {
  const clone = JSON.parse(JSON.stringify(chartData.sections[si]));
  clone.label = clone.label + ' (bis)';
  chartData.sections.splice(si + 1, 0, clone);
  render();
}

function deleteSection(si) {
  if (chartData.sections.length <= 1) return alert('Impossible de supprimer la dernière section.');
  chartData.sections.splice(si, 1);
  render();
}

function addMeasure(si) {
  const timeSig = chartData.timeSig || '4/4';
  const beats = parseInt(timeSig.split('/')[0]) || 4;
  chartData.sections[si].measures.push({
    chords: [{ symbol: '%', beats }],
    repeatStart: false,
    repeatEnd: false
  });
  render();
}

function deleteMeasure(si, mi) {
  chartData.sections[si].measures.splice(mi, 1);
  render();
}

function updateAllCols() {
  render();
}

// ========================
// EXPORT / IMPORT
// ========================
function exportJSON() {
  // Sync meta
  chartData.title = document.getElementById('chart-title').value;
  chartData.key = document.getElementById('meta-key').value;
  chartData.tempo = document.getElementById('meta-tempo').value;
  chartData.timeSig = document.getElementById('meta-time').value;
  chartData.style = document.getElementById('meta-style').value;

  const blob = new Blob([JSON.stringify(chartData, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (chartData.title || 'chart') + '.json';
  a.click();
}

document.getElementById('import-json').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      chartData = JSON.parse(ev.target.result);
      document.getElementById('dropzone').style.display = 'none';
      document.getElementById('chart-editor').style.display = 'block';
      render();
    } catch(err) { alert('Fichier JSON invalide.'); }
  };
  reader.readAsText(file);
});

// ========================
// FILE HANDLING
// ========================
document.getElementById('file-input').addEventListener('change', e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      chartData = parseMusicXML(ev.target.result);
      document.getElementById('dropzone').style.display = 'none';
      document.getElementById('chart-editor').style.display = 'block';
      render();
    } catch(err) {
      console.error(err);
      alert('Erreur lors de la lecture du fichier MusicXML.');
    }
  };
  reader.readAsText(file);
  e.target.value = '';
});

// Drag & drop
const dz = document.getElementById('dropzone');
dz.addEventListener('dragover', e => { e.preventDefault(); dz.classList.add('drag-over'); });
dz.addEventListener('dragleave', () => dz.classList.remove('drag-over'));
dz.addEventListener('drop', e => {
  e.preventDefault();
  dz.classList.remove('drag-over');
  const file = e.dataTransfer.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = ev => {
    try {
      chartData = parseMusicXML(ev.target.result);
      document.getElementById('dropzone').style.display = 'none';
      document.getElementById('chart-editor').style.display = 'block';
      render();
    } catch(err) {
      alert('Erreur lors de la lecture du fichier MusicXML.');
    }
  };
  reader.readAsText(file);
});

// Sync meta inputs
['chart-title','meta-key','meta-tempo','meta-time','meta-style'].forEach(id => {
  document.getElementById(id).addEventListener('change', e => {
    const map = {
      'chart-title':'title','meta-key':'key','meta-tempo':'tempo','meta-time':'timeSig','meta-style':'style'
    };
    chartData[map[id]] = e.target.value;
  });
});

// Close modal on overlay click
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});

// Keyboard
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

// Init
buildModal();
</script>
